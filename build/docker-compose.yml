services:
  jupyter:
    build:
      context: ..
      dockerfile: build/dockerfile
    image: ghcr.io/pyhpc/pyhpc-tutorial:latest
    pull_policy: always
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "0.0.0.0:8888:8888" # JupyterLab
    volumes:
      - /home/ubuntu/pyhpc-tutorial:/pyhpc-tutorial
    user: root
    working_dir: /pyhpc-tutorial/notebooks
    restart: unless-stopped
  nsight-streamer:
    image: nvcr.io/nvidia/devtools/nsight-streamer-nsys:2025.3.1
    pull_policy: always
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - WEB_USERNAME=""
      - WEB_PASSWORD=""
    ports:
      - "0.0.0.0:8080:8080" # HTTP
      - "0.0.0.0:3478:3478" # TURN
    volumes:
      - /home/ubuntu/pyhpc-tutorial:/pyhpc-tutorial
    user: root
    working_dir: /pyhpc-tutorial/notebooks
    restart: unless-stopped
